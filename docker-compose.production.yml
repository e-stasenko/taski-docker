volumes:
  pg_data:
  static_value:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: estasenko/taski_backend:latest
    env_file: .env
    volumes:
      - static_value:/backend_static

  frontend:
    image: estasenko/taski_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_value:/frontend_static

  gateway:
    image: estasenko/taski_gateway:latest
    env_file: .env
    volumes:
      - static_value:/staticfiles
    ports:
      - 8000:80